[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.27" ]

[project]
name = "disambiguate"
version = "0.1.0"
description = """\
  A tool to resolve markdown glossary terms and their transitive dependencies in topological order in a GitHub project \
  or Obsidian vault.\
  """
readme = "README.md"
license = "MIT"
authors = [
  { name = "Frankify", email = "creator@frankify.app" },
]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
]
dependencies = []
urls."Bug Tracker" = "https://github.com/frankify-app/disambiguate/issues"
urls.Changelog = "https://github.com/frankify-app/disambiguate/blob/main/CHANGELOG.md"
urls.documentation = "https://disambiguate.readthedocs.io"
urls.repository = "https://github.com/frankify-app/disambiguate"
scripts.disambiguate = "disambiguate.cli:main"

[dependency-groups]
dev = [
  "build>=1.2",
  "mypy>=1.8,<2",
  "pytest==9.*",
  "pytest-cov==7.*",
  "python-semantic-release>=10",
  "ruff>=0.6",
  "typer>=0.23.1",
]

[tool.hatch]
build.hooks.custom.path = "hatch_build.py"
build.targets.sdist.include = [
  "src/disambiguate",
  "docs/glossary",
  "README.md",
  "LICENSE",
]
build.targets.wheel.packages = [ "src/disambiguate" ]

[tool.ruff]
line-length = 88
lint.select = [
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # flake8-docstrings
  "E",   # pycodestyle
  "F",   # pyflake
  "I",   # isort
  "RUF", # ruff specific
  "S",   # flake8-bandit
  "UP",  # pyupgrade
  "W",   # pycodestyle
]
lint.ignore = [
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D107", # Missing docstring in `__init__`
  "D203", # 1 blank line required before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D401", # First line of docstring should be in imperative mood
]
lint.per-file-ignores."conftest.py" = [ "D100" ]
lint.per-file-ignores."hatch_build.py" = [ "D" ]
lint.per-file-ignores."tests/**/*" = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "E501", # long lines OK in test data
  "S101", # asserts are fine in tests
  "S108", # /tmp Path placeholders never touch the filesystem
]
lint.per-file-ignores."tests/unit/test_dunder_main.py" = [ "S603" ]
lint.isort.known-first-party = [ "tests" ]

[tool.pyproject-fmt]
max_supported_python = "3.14"

[tool.mypy]
python_version = "3.12"
strict = true
files = [ "src", "tests", "dev_cli.py" ]

[tool.pytest]
ini_options.minversion = "9.0"
ini_options.addopts = [
  "-Wonce",
  "-p no:doctest",
]
ini_options.pythonpath = [ "src" ]
ini_options.testpaths = [ "tests" ]

[tool.coverage]
run.branch = true
paths.source = [
  "src",
  ".tox/**/site-packages",
]
report.exclude_lines = [
  "@overload",
  'if __name__ == "__main__":',
  "if TYPE_CHECKING",
  "pragma: no cover",
  "raise NotImplementedError",
]

[tool.semantic_release]
allow_zero_version = true
version_toml = [ "pyproject.toml:project.version" ]
version_variables = [ "src/disambiguate/__init__.py:__version__" ]
commit_parser = "conventional"
build_command = """
python -m pip install --upgrade build
python -m build
"""
upload_to_vcs_release = true
branches.main.match = "main"
branches.noop.match = "(?!main$)"
branches.noop.prerelease = true
changelog.exclude_commit_patterns = [
  "chore(?:\\([^)]*?\\))?: .+",
  "ci(?:\\([^)]*?\\))?: .+",
  "refactor(?:\\([^)]*?\\))?: .+",
  "style(?:\\([^)]*?\\))?: .+",
  "test(?:\\([^)]*?\\))?: .+",
  "build\\((?!deps\\): .+)",
  "Merged? .*",
  "Initial [Cc]ommit.*",         # codespell:ignore
]
changelog.environment.keep_trailing_newline = true
