name: Publish

on:
  push:
    tags:
      - "v*"

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    # The `pypi` environment has required reviewers and a `v*` deployment
    # tag restriction, gating PyPI uploads behind manual approval. Trusted
    # publishing on PyPI must reference this environment.
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download Python distributions from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # The Release also carries the Claude bundle zip; restrict the
        # download to wheels and sdists so it is never uploaded to PyPI.
        run: |
          mkdir -p dist
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern '*.whl' \
            --pattern '*.tar.gz'

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
