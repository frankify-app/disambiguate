# The uniform CI gate (agentic-engineering-template#137, #143).
#
# `ci-ok` is the ONE context branch protection requires, everywhere,
# forever: it discovers every pull_request-triggered workflow on this
# head SHA at runtime and fails unless every one of their jobs
# succeeded — adding or renaming a job changes nothing here, which is
# the point. The ticket and review-answers gates ride the same vehicle
# so the required-context list never grows.
#
# Label, body and review events re-run only THIS workflow — the gate
# re-judges without re-running the test matrix.
#
# Re-requesting a review re-runs the gate too (#168). That is the path
# for a reviewer who RESOLVED threads rather than replying: resolution
# emits no Actions event at all — `pull_request_review_thread` is an
# App-only webhook — and a job re-run reuses the merge commit from the
# original run, so it re-judges the old base with the old gate. A
# fresh event is the only thing that recomputes the merge ref.
name: CI gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled,
            review_requested, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  actions: read
  pull-requests: read
  # The ticket job reads closing targets' timelines (#150): a CLOSES
  # whose ticket other open PRs still reference warns before the merge
  # closes it under them.
  issues: read

concurrency:
  group: ci-ok-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ticket:
    name: "ticket reference"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Reads the event payload, the central keyword file, and — for
      # tickets a closing keyword names — the ticket's timeline: the
      # allow-list is exact ALL CAPS (ADVANCES/CLOSES/FIXES — rendered here
      # from reference-keywords.json, the single source), any native
      # closing keyword in any other casing fails the PR, and the only
      # escape is the `automated` label on a bot-authored PR. A close
      # whose ticket other open PRs still reference is a warning (#150).
      - name: The PR names its tickets canonically
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_KEYWORDS: .github/reference-keywords.json
        run: python3 scripts/ci/check_gate.py ticket

  review-answers:
    name: "review answers"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # Every review thread opened by a human needs a PR-author reply
      # carrying a full commit URL verified against this PR's commits,
      # or a line starting `No commit:` followed by
      # the reason (the marker is rendered from reference-keywords.json,
      # the single source). Resolving a thread is not answering it (#143).
      - name: Every human review thread is answered
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_KEYWORDS: .github/reference-keywords.json
        run: python3 scripts/ci/check_gate.py reviews

  leaks:
    name: "leaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # gitleaks walks the PR's own commits, not just the merge ref.
          fetch-depth: 0

      # Credential class (#189): the pinned gitleaks binary scans every
      # PR commit's content. Pinned by version AND checksum — a moving
      # release tag could swap the scanner under every repo's CI at
      # once. --redact keeps whatever it finds out of this public log.
      - name: gitleaks finds no credential in any PR commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 \
            --log-opts "$BASE_SHA..$HEAD_SHA"

      # Identity class (#189): known strings, matched verbatim against
      # every surface this PR publishes. The org secret carries values
      # only — the repo commits nothing but this variable's name.
      - name: No blocklisted string on any surface this PR publishes
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BLOCKLIST: ${{ secrets.PUSH_BLOCKLIST }}
        run: python3 scripts/ci/check_gate.py leaks

  approval:
    name: "merge approval"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # An allowlisted human's latest review must APPROVE the current
      # head commit (stale approvals name the commit gap), or the PR is
      # authored by an approver — authorship is approval by the same
      # party, since GitHub forbids approving one's own PR. The
      # `automated`-label + bot-author escape matches the ticket gate,
      # so release and template-update PRs do not wait on a click (#187).
      - name: A current human approval covers this head
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_APPROVERS: .github/merge-approvers.json
        run: python3 scripts/ci/check_gate.py approval

  ci-ok:
    name: "ci-ok"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Every job of every PR workflow succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/check_gate.py aggregate
