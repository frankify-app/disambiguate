name: Release

on:
  push:
    branches:
      - main

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Mint an installation token for the release bot GitHub App. The app
      # identity authors the version-bump commit/tag and is allow-listed in
      # branch protection so it can push to `main`. App-token pushes recurse
      # into other workflows, so the tag push triggers `publish.yml`
      # (`GITHUB_TOKEN` pushes would not). The follow-up run on `main` from
      # the version-bump commit finds no releasable commits and exits as a
      # no-op.
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Run python-semantic-release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Build Claude bundle
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make "dist/disambiguate-v${VERSION}-claude-bundle.zip"

      - name: Upload artifacts to GitHub Release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
