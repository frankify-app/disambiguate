name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    # Only release when CI succeeded for the head commit of `main`. The
    # `workflow_run` trigger fires for every CI completion (including
    # failures and runs on other branches), so we gate explicitly here.
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: write

    steps:
      # Mint an installation token for the release bot GitHub App. The app
      # identity authors the version-bump commit/tag and is allow-listed in
      # branch protection so it can push to `main`. App-token pushes recurse
      # into other workflows, so the tag push triggers `publish.yml`
      # (`GITHUB_TOKEN` pushes would not). The follow-up run on `main` from
      # the version-bump commit finds no releasable commits and exits as a
      # no-op.
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # Check out the `main` branch, NOT the CI run's head SHA: a bare-SHA
      # checkout leaves the repo in detached HEAD state, and
      # python-semantic-release matches release groups by branch name, so a
      # detached HEAD always no-ops ("Detached HEAD state cannot match any
      # release groups"). See #19.
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      # Only release when the commit whose CI just turned green is still the
      # head of `main`. If `main` has moved on, skip: the newer commit's own
      # CI run will trigger its own release, and releasing here would tag a
      # commit that never went green.
      # DECISION:SCOPE guard-and-skip instead of `git checkout -B main
      # <head_sha>`: forcing the branch onto the CI'd SHA would release a
      # commit that is no longer main's tip, and the version-bump push would
      # then conflict with the real `main`.
      - name: Ensure `main` still points at the CI'd commit
        id: guard
        env:
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ "${head}" = "${CI_HEAD_SHA}" ]; then
            echo "release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "main is at ${head}, but CI ran for ${CI_HEAD_SHA}; skipping release"
            echo "release=false" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"

      - name: Run python-semantic-release
        if: steps.guard.outputs.release == 'true'
        id: release
        uses: python-semantic-release/python-semantic-release@v10.5.3
        with:
          github_token: ${{ steps.app-token.outputs.token }}

      - name: Build Claude bundle
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: make "dist/disambiguate-v${VERSION}-claude-bundle.zip"

      - name: Upload artifacts to GitHub Release
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10.5.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}
